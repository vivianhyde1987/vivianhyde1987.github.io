          <span></span>
          <span></span>
          <span></span>

      <section class="notice-strip" aria-label="声音入口">
        <div class="sound-cluster" aria-label="疗愈声音">
          <button id="soundToggle" class="sound-toggle" type="button" data-sound-mode="bowl">
            <span class="sound-toggle__icon">◎</span>
            <span class="sound-toggle__label">疗愈颂钵</span>
          </button>
          <button class="sound-toggle" type="button" data-sound-mode="stream">
            <span class="sound-toggle__icon">≋</span>
            <span class="sound-toggle__label">溪流摇铃</span>
          </button>
          <button class="sound-toggle" type="button" data-sound-mode="cosmos">

          </button>
        </div>
      </section>

      <main class="layout">
        <aside class="sidebar" aria-label="账号">
          <section class="panel auth-panel">
            <div class="panel__head">
              <h2>账号</h2>
              <span id="authStatus">未登录</span>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="账号操作">
              <button class="active" type="button" data-auth-tab="login">登录</button>
              <button type="button" data-auth-tab="register">注册</button>
            </div>

            <form id="loginForm" class="stack auth-view">
              <label>
                永久 ID
                <input id="loginHandle" maxlength="24" autocomplete="username" required />
              </label>
              <label>
                密码
                <input id="loginPassword" type="password" autocomplete="current-password" required />
              </label>
              <button type="submit">登录</button>
            </form>

            <form id="registerForm" class="stack auth-view" hidden>
              <label>
                永久 ID
                <input id="registerHandle" maxlength="24" placeholder="例如 vivian" autocomplete="username" required />
              </label>
              <label>
                密码
                <input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required />
              </label>
              <button type="submit">注册 ID</button>
            </form>

            <div class="profile-card" id="profileCard" hidden></div>
            <p class="auth-note" id="authMessage">只需要记住自己的 ID 和密码。</p>
            <div class="account-share">
              <button id="copyInviteButton" type="button">复制邀请语</button>
              <button id="posterButton" type="button">生成分享海报</button>
              <div id="sharePoster" class="share-poster" hidden></div>
            </div>
            <form id="avatarForm" class="avatar-designer">
              <strong>头像</strong>
              <div class="avatar-preview" id="avatarPreview" aria-label="头像预览"></div>
              <label>
                颜色
                <input id="avatarColorInput" type="color" value="#b62548" />
              </label>
              <label>
                形状
                <select id="avatarShapeInput">
                  <option value="circle">圆形</option>
                  <option value="soft">柔方</option>
                  <option value="diamond">菱形</option>
                </select>
              </label>
              <label>
                标记
                <input id="avatarMarkInput" maxlength="2" value="R" />
              </label>
              <label class="avatar-upload">
                照片
                <input id="avatarImageInput" type="file" accept="image/*" />
              </label>
              <button type="submit">保存头像</button>
            </form>
          </section>
        </aside>

              <div class="hive-counter__buttons">
                <button type="button" data-hive-area="脖子">脖子 <span>0</span></button>
                <button type="button" data-hive-area="四肢">四肢 <span>0</span></button>
                <button type="button" data-hive-area="躯干">躯干 <span>0</span></button>
                <button type="button" data-hive-area="头">头 <span>0</span></button>
                <button type="button" data-hive-area="脸">脸 <span>0</span></button>
              </div>
              <small>看到一次风团就点一次，数字会自动记入今天。</small>
              <div class="hive-month" aria-label="本月风团月历">
                <div class="hive-month__head">
                  <strong>本月复诊摘要</strong>
                  <span id="hiveMonthSummary">本月暂无记录</span>
                </div>
                <div id="hiveMonthGrid" class="hive-month__grid"></div>
              </div>
            </div>
            <form id="eventLogForm" class="event-log-form">
              <label>
                吃药时间
                <input id="eventTimeInput" type="datetime-local" />
              </label>
              <label>
                药品种类
                <input id="medicineInput" maxlength="80" placeholder="例如：氯雷他定、西替利嗪" />
              </label>
              <label class="wide">
                备注
                <textarea id="eventNoteInput" rows="3" maxlength="600" placeholder="例如：几点出现风团，可能原因，是否瘙痒，是否缓解"></textarea>
              </label>
              <button type="submit">保存记录</button>
            </form>
            <div class="medicine-history-tools">
              <button id="medicineHistoryToggle" type="button">查看服药记录</button>
              <button id="copyMedicineSummary" type="button">复制复诊摘要</button>
            </div>
            <div id="eventLogList" class="event-log-list" aria-live="polite" hidden></div>
          </section>

          <section class="sleep-panel panel" aria-label="睡眠管理">
            <div class="panel__head">
              <h2>睡眠管理</h2>
              <span id="sleepNowText">现在时间</span>
            </div>
            <div class="sleep-ritual">
              <p id="sleepAffirmation">今晚也可以慢慢放下今天。</p>
              <button id="sleepStartButton" type="button">准备睡觉</button>
              <small id="sleepRecordText">点击后记录今晚准备睡觉的时间。</small>
            </div>
            <form id="sleepQuizForm" class="sleep-quiz">
              <label>
                今天身体感觉
                <select name="body">
                  <option value="2">比较放松</option>
                  <option value="1">有一点紧</option>
                  <option value="0">很疲惫</option>
                </select>
              </label>
              <label>
                今天情绪
                <select name="mood">
                  <option value="2">平稳</option>
                  <option value="1">有起伏</option>
                  <option value="0">比较沉</option>
                </select>
              </label>
              <label>
                今天完成感
                <select name="done">
                  <option value="2">有完成一些</option>
                  <option value="1">普通</option>
                  <option value="0">有点卡住</option>
                </select>
              </label>
              <label>
                睡前脑内声音
                <select name="mind">
                  <option value="2">安静</option>
                  <option value="1">还在想事</option>
                  <option value="0">停不下来</option>
                </select>
              </label>
              <label>
                此刻最需要
                <select name="need">
                  <option value="soft">被安抚</option>
                  <option value="release">放下压力</option>
                  <option value="hope">一点希望</option>
                </select>
              </label>
              <button type="submit">生成今晚收尾</button>
            </form>
            <div id="sleepSummary" class="sleep-summary" aria-live="polite"></div>
          </section>

          <section class="composer panel">
            <div class="panel__head">
              <h2>写一篇</h2>
              <span id="todayText"></span>
            </div>
            <form id="postForm" class="post-form">
              <input id="categoryInput" type="hidden" value="文章" />
              <label class="wide">
                标题
                <input id="titleInput" maxlength="80" placeholder="写下文章标题" />
              </label>
              <label class="wide">
                正文
                <textarea id="bodyInput" rows="7" maxlength="4000" placeholder="写下正文"></textarea>
                <small id="bodyCount" class="field-meter">0 / 4000 字</small>
              </label>
              <label class="wide media-upload">
                <span>上传照片</span>
                <input id="imageInput" type="file" accept="image/*" />
                <small id="imageSizeHint" class="file-hint">未选择照片</small>
                <button id="clearImageInput" class="clear-media" type="button" hidden>删除重选</button>
              </label>
              <label class="wide media-upload media-upload--video">
                <span>上传视频</span>
                <small>手机相册里的短视频，建议 50MB 以内</small>
                <input id="videoInput" type="file" accept="video/mp4,video/webm,video/quicktime,video/*" />
                <small id="videoSizeHint" class="file-hint">未选择视频</small>
                <button id="clearVideoInput" class="clear-media" type="button" hidden>删除重选</button>
              </label>
              <button class="wide" type="submit">保存到博客</button>
            </form>
          </section>

          <section class="chat panel" aria-label="临时讨论区">
            <div class="panel__head">
              <h2>临时讨论区</h2>
              <span>文字 / 贴图 / 点赞 / 回复</span>
            </div>
            <form id="chatForm" class="chat-form">
              <label class="wide">
                聊天内容
                <textarea id="chatBodyInput" rows="3" maxlength="800" placeholder="朋友来了可以在这里临时聊几句"></textarea>
              </label>
              <label>
                贴图
                <input id="chatImageInput" type="file" accept="image/*" />
              </label>
              <button type="submit">发送</button>
            </form>
            <div id="chatList" class="chat-list" aria-live="polite"></div>
          </section>

          <div class="archive-title archive-title--folded" id="archiveTitle">
            <div class="archive-title__copy">
              <span>文章手记</span>
              <small id="syncStatus">准备同步</small>
            </div>
            <button id="archiveToggle" type="button">展开历史</button>
          </div>
          <section id="feed" class="feed is-collapsed" aria-live="polite"></section>
        </section>
      </main>
    </div>

    <details class="mimi-companion" aria-label="眯眯陪伴组件">
      <summary class="mimi-companion__photo">
        <img src="assets/mimi-face-v2.jpg" alt="眯眯的脸" />
        <span class="mimi-companion__glow"></span>
      </summary>
      <div class="mimi-companion__note">
        <strong>眯眯</strong>
        <p>今天也在这里陪你写博客。</p>
      </div>
    </details>

    <template id="postTemplate">
      <article class="post">
        <div class="post__meta">
          <div class="post-author">
            <span class="user-avatar"><span></span></span>
            <div>
              <h3></h3>
              <p></p>
            </div>
          </div>
          <span class="mood"></span>
        </div>
        <div class="post__image-frame" hidden>
          <img class="post__image" alt="文章插图" />
        </div>
        <video class="post__video" controls playsinline preload="metadata" hidden></video>
        <p class="post__body"></p>
        <div class="comments"></div>
        <form class="comment-form">
          <input maxlength="500" placeholder="写评论" required />
          <button type="submit">评论</button>
        </form>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js?v=lottery-history-20260613"></script>
  </body>
</html>
