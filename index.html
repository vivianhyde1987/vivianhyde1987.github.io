<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rose & Rainbow Blog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <img src="assets/jrock-diary-hero.png" alt="Rose and rainbow diary" />
        <div class="hero__shade"></div>
        <nav class="topbar" aria-label="站点导航">
          <div class="brand">
            <span class="brand__mark">R/R</span>
            <span>Rose & Rainbow Blog</span>
          </div>
          <div class="session" id="sessionArea"></div>
        </nav>
        <section class="hero__copy">
          <div class="hero__badges" aria-label="栏目入口">
            <button type="button" data-category="日志">日志</button>
            <button type="button" data-category="小说">小说</button>
            <button type="button" data-category="相册">相册</button>
            <button type="button" data-category="心情">心情</button>
          </div>
        </section>
      </header>

      <section class="notice-strip" aria-label="小站公告">
        <button id="soundToggle" class="sound-toggle" type="button">疗愈颂钵</button>
      </section>

      <main class="layout">
        <aside class="sidebar" aria-label="账号">
          <section class="panel auth-panel">
            <div class="panel__head">
              <h2>账号</h2>
              <span id="authStatus">未登录</span>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="账号操作">
              <button class="active" type="button" data-auth-tab="login">登录</button>
              <button type="button" data-auth-tab="register">注册</button>
            </div>

            <form id="loginForm" class="stack auth-view">
              <label>
                永久 ID
                <input id="loginHandle" maxlength="24" autocomplete="username" required />
              </label>
              <label>
                密码
                <input id="loginPassword" type="password" autocomplete="current-password" required />
              </label>
              <button type="submit">登录</button>
            </form>

            <form id="registerForm" class="stack auth-view" hidden>
              <label>
                永久 ID
                <input id="registerHandle" maxlength="24" placeholder="例如 vivian" autocomplete="username" required />
              </label>
              <label>
                密码
                <input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required />
              </label>
              <button type="submit">注册 ID</button>
            </form>

            <div class="profile-card" id="profileCard" hidden></div>
            <p class="auth-note" id="authMessage">只需要记住自己的 ID 和密码。</p>
          </section>

          <section class="panel">
            <div class="panel__head">
              <h2>头像</h2>
              <span>自己设计</span>
            </div>
            <form id="avatarForm" class="avatar-designer">
              <div class="avatar-preview" id="avatarPreview" aria-label="头像预览"></div>
              <label>
                颜色
                <input id="avatarColorInput" type="color" value="#b62548" />
              </label>
              <label>
                形状
                <select id="avatarShapeInput">
                  <option value="circle">圆形</option>
                  <option value="soft">柔方</option>
                  <option value="diamond">菱形</option>
                </select>
              </label>
              <label>
                标记
                <input id="avatarMarkInput" maxlength="2" value="R" />
              </label>
              <label class="avatar-upload">
                照片
                <input id="avatarImageInput" type="file" accept="image/*" />
              </label>
              <button type="submit">保存头像</button>
            </form>
          </section>
        </aside>

        <section class="content">
          <section class="category-nav panel" aria-label="博客栏目">
            <button class="active" type="button" data-category="日志">日志</button>
            <button type="button" data-category="小说">小说</button>
            <button type="button" data-category="相册">相册</button>
            <button type="button" data-category="心情">心情</button>
          </section>

          <section class="wish-pool panel" aria-label="许愿池">
            <div class="panel__head">
              <h2>许愿池</h2>
              <span id="koiCoinText">锦鲤币 0</span>
            </div>
            <div class="wish-pool__pond" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p class="wish-pool__note">评论 +3，文章点赞 +1。攒够锦鲤币就可以在这里投一个工作日愿望。</p>
            <div id="wishOptions" class="wish-options"></div>
            <div id="wishHistory" class="wish-history" aria-live="polite"></div>
          </section>

          <section class="composer panel">
            <div class="panel__head">
              <h2>写一篇</h2>
              <span id="todayText"></span>
            </div>
            <form id="postForm" class="post-form">
              <label>
                栏目
                <select id="categoryInput">
                  <option>日志</option>
                  <option>小说</option>
                  <option>相册</option>
                  <option>心情</option>
                </select>
              </label>
              <label>
                标题
                <input id="titleInput" maxlength="80" placeholder="相册可以不填，会自动命名" />
              </label>
              <label class="wide">
                正文
                <textarea id="bodyInput" rows="7" maxlength="4000" placeholder="相册可以只上传照片"></textarea>
              </label>
              <label class="wide">
                上传照片
                <input id="imageInput" type="file" accept="image/*" />
              </label>
              <button class="wide" type="submit">保存到博客</button>
            </form>
          </section>

          <section class="chat panel" aria-label="临时讨论区">
            <div class="panel__head">
              <h2>临时讨论区</h2>
              <span>文字 / 贴图 / 点赞</span>
            </div>
            <form id="chatForm" class="chat-form">
              <label class="wide">
                聊天内容
                <textarea id="chatBodyInput" rows="3" maxlength="800" placeholder="朋友来了可以在这里临时聊几句"></textarea>
              </label>
              <label>
                贴图
                <input id="chatImageInput" type="file" accept="image/*" />
              </label>
              <button type="submit">发送</button>
            </form>
            <div id="chatList" class="chat-list" aria-live="polite"></div>
          </section>

          <section class="feed-tools">
            <div class="tabs" role="tablist" aria-label="当前栏目">
              <button class="active" type="button" data-category="日志">日志</button>
              <button type="button" data-category="小说">小说</button>
              <button type="button" data-category="相册">相册</button>
              <button type="button" data-category="心情">心情</button>
            </div>
            <span id="syncStatus">准备同步</span>
          </section>

          <div class="archive-title" id="archiveTitle">日志历史文章</div>
          <section id="feed" class="feed" aria-live="polite"></section>
        </section>
      </main>
    </div>

    <details class="mimi-companion" aria-label="眯眯陪伴组件">
      <summary class="mimi-companion__photo">
        <img src="assets/mimi-face-v2.jpg" alt="眯眯的脸" />
        <span class="mimi-companion__glow"></span>
      </summary>
      <div class="mimi-companion__note">
        <strong>眯眯</strong>
        <p>今天也在这里陪你写博客。</p>
      </div>
    </details>

    <template id="postTemplate">
      <article class="post">
        <div class="post__meta">
          <div class="post-author">
            <span class="user-avatar"><span></span></span>
            <div>
              <h3></h3>
              <p></p>
            </div>
          </div>
          <span class="mood"></span>
        </div>
        <img class="post__image" alt="" hidden />
        <p class="post__body"></p>
        <div class="comments"></div>
        <form class="comment-form">
          <input maxlength="500" placeholder="写评论" required />
          <button type="submit">评论</button>
        </form>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
